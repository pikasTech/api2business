apiVersion: api2business.pikapython.com/v1
kind: FailoverTemplate
name: gemini-upstream-failover
platform: gemini
rules:
- errorCode: 400
  keywords:
  - invalid_request_error
  - invalid model
  durationMinutes: 3
  description: Gemini 上游明确拒绝请求参数或模型时短暂冷却并切号
- errorCode: 401
  keywords:
  - invalid api key
  - invalid_api_key
  - authentication failed
  - unauthorized
  - token expired
  - API key is disabled
  durationMinutes: 10
  description: Gemini API key 认证失效或被禁用
- errorCode: 402
  keywords:
  - insufficient balance
  - insufficient account balance
  - payment required
  - 余额不足
  durationMinutes: 10
  description: Gemini 上游余额或账单不足
- errorCode: 403
  keywords:
  - permission denied
  - forbidden
  - API Key 所属分组已删除
  - 余额不足
  durationMinutes: 10
  description: Gemini 上游权限、分组或余额拒绝
- errorCode: 404
  keywords:
  - model_not_found
  - model not found
  - not supported by any configured account
  - no available channel for model
  - is not available
  durationMinutes: 3
  description: Gemini 上游明确返回模型或渠道不可用时短暂切号
- errorCode: 404
  keywords:
  - "0 endpoints out of 2 requested are available matching your guardrail restrictions and data policy"
  durationMinutes: 3
  description: Gemini 上游明确因 guardrail 排除全部候选端点时短暂冷却并切号
- errorCode: 429
  keywords:
  - rate limit
  - rate_limit_exceeded
  - too many requests
  - resource_exhausted
  - resource exhausted
  - All available accounts are currently rate-limited. Please retry later.
  durationMinutes: 3
  description: Gemini 上游限流时切号并短暂冷却
- errorCode: 500
  keywords:
  - internal server error
  - upstream service temporarily unavailable
  durationMinutes: 3
  description: Gemini 上游服务端故障
- errorCode: 502
  keywords:
  - bad gateway
  - upstream request failed
  - upstream service temporarily unavailable
  - stream disconnected
  - 'error code: 502'
  durationMinutes: 3
  description: Gemini 上游网关或流式响应故障
- errorCode: 503
  keywords:
  - service unavailable
  - temporarily unavailable
  - overloaded
  - no available accounts
  durationMinutes: 3
  description: Gemini 上游暂时不可用或过载
- errorCode: 504
  keywords:
  - gateway timeout
  - upstream timeout
  - request timeout
  durationMinutes: 3
  description: Gemini 上游超时
- errorCode: 529
  keywords:
  - overloaded
  durationMinutes: 3
  description: Gemini 上游明确返回过载
